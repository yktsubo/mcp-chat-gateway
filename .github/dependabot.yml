version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Update react and react-dom together; they must have the same version
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # next-auth v4 requires openid-client v5
      - dependency-name: openid-client
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
